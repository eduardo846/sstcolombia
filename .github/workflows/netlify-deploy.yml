name: Deploy to Netlify

on:
  push:
    branches:
      - deployment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate deployment settings
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "::error::Configure the NETLIFY_AUTH_TOKEN repository secret."; exit 1; }
          test -n "$NETLIFY_SITE_ID" || { echo "::error::Configure the NETLIFY_SITE_ID repository secret."; exit 1; }
          case "$VITE_API_URL" in
            https://*) ;;
            *) echo "::error::Configure the VITE_API_URL repository variable with the HTTPS PostgREST URL."; exit 1 ;;
          esac
          case "$VITE_API_URL" in
            */) echo "::error::VITE_API_URL must not end with a slash."; exit 1 ;;
          esac

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Deploy production site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli deploy --prod --dir=frontend/dist --site="$NETLIFY_SITE_ID"
